name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q DiscordBotAPKProject.zip -d project
          find project -maxdepth 6 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-setuptools \
            python3-venv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install Cython==0.29.37

      - name: Find and configure project
        shell: bash
        run: |
          set -e

          SPEC=$(find project -name "buildozer.spec" -type f | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          cd "$PROJECT_DIR"

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          lines = path.read_text(encoding="utf-8").splitlines()

          updates = {
              "requirements": "python3,kivy,discord.py,aiohttp",
              "android.minapi": "24",
              "android.api": "35",
              "android.archs": "arm64-v8a",

              # Pin python-for-android to a known release.
              "p4a.branch": "master",
              "p4a.commit": "58d2114",
          }

          for key, value in updates.items():
              prefix = key + " ="

              for i, line in enumerate(lines):
                  if line.strip().startswith(prefix):
                      lines[i] = f"{key} = {value}"
                      break
              else:
                  lines.append(f"{key} = {value}")

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Project configuration:")
          for key, value in updates.items():
              print(f"{key} = {value}")
          PY

          echo
          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "=========================="

      - name: Clean Buildozer Android build
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Cleaning previous Buildozer build directories..."

          rm -rf .buildozer
          rm -rf bin

          echo "Clean build environment ready."

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          set +e

          buildozer -v android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          set -e

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "BUILD FAILED"
            echo
            echo "===== Relevant errors ====="

            grep -i -E \
              "error:|exception|failed|fatal|traceback|command failed" \
              build.log | tail -n 100 || true

            echo "==========================="

            exit "$BUILD_EXIT"
          fi

          echo "BUILD SUCCESSFUL"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DiscordAPK
          path: "${{ env.PROJECT_DIR }}/bin/*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DiscordAPK-Build-Log
          path: "${{ env.PROJECT_DIR }}/build.log"
          if-no-files-found: ignore
          retention-days: 14
