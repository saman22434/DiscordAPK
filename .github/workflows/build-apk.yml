name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q DiscordBotAPKProject.zip -d project
          find project -maxdepth 6 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-setuptools \
            python3-venv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Find Buildozer project
        run: |
          SPEC=$(find project -name "buildozer.spec" -type f | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "Found: $SPEC"
          echo "Project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK with full error log
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          buildozer -v android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "POSSIBLE ERROR LINES"
            echo "========================================"

            grep -i -E \
              "error:|error |exception|failed|fatal|traceback|command failed" \
              build.log | tail -n 100 || true

            echo ""
            echo "========================================"
            echo "LAST 200 LINES"
            echo "========================================"

            tail -n 200 build.log

            exit "$BUILD_EXIT"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DiscordAPK
          path: "project/**/bin/*.apk"
          if-no-files-found: error
